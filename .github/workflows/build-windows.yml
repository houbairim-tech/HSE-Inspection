name: Build HSE 107E Windows EXE
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'DOC-20261119-WA0121.zip'
      - 'cloudflare/**'
      - 'desktop/**'
      - '.github/workflows/build-windows.yml'
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Download original desktop source
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/houbairim-tech/Hse-ande/main/HSE107E_Installer_and_Portable_Source.zip" -OutFile "HSE107E_Installer_and_Portable_Source.zip"
          Expand-Archive -Path "HSE107E_Installer_and_Portable_Source.zip" -DestinationPath "source"
      - name: Inject Cloudflare client
        shell: pwsh
        run: |
          Copy-Item "cloudflare/cloud-sync.js" "source/desktop/cloud-sync.js" -Force
          $p="source/desktop/index.html"
          $s=Get-Content $p -Raw
          if($s -notmatch 'cloud-sync.js'){ $s=$s -replace '</head>','<script src="cloud-sync.js"></script></head>' }
          Set-Content -Path $p -Value $s -Encoding UTF8
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        working-directory: source/desktop
        run: npm install
      - name: Build Windows installer and portable EXE
        working-directory: source/desktop
        run: npm run dist
      - name: Verify Windows artifacts
        shell: pwsh
        run: |
          $files=Get-ChildItem "source/desktop/dist" -File
          if($files.Count -lt 2){ throw "Expected NSIS + portable artifacts were not produced." }
          $files | ForEach-Object { Write-Host "$($_.Name) $($_.Length) bytes" }
      - uses: actions/upload-artifact@v4
        with:
          name: HSE107E-Windows-Final
          if-no-files-found: error
          path: |
            source/desktop/dist/*.exe
