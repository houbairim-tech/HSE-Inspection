name: Build HSE 107E APK - Compatible Phone

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'DOC-20261119-WA0121.zip'
      - 'mobile/**'
      - '.github/workflows/build-android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Extract project and apply phone compatibility fix
        run: |
          unzip -q DOC-20261119-WA0121.zip -d source

          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("source/android")
          if not root.exists():
              raise SystemExit("Android project not found in source archive")

          # Make the APK broadly installable on older Android/EMUI devices while
          # remaining fully compatible with current Android versions.
          for p in root.rglob("*.gradle"):
              s = p.read_text(errors="ignore")
              s = re.sub(r'(?i)minSdkVersion\s+\d+', 'minSdkVersion 21', s)
              s = re.sub(r'(?i)minSdk\s*=\s*\d+', 'minSdk = 21', s)
              s = re.sub(r'(?i)targetSdkVersion\s+\d+', 'targetSdkVersion 35', s)
              s = re.sub(r'(?i)targetSdk\s*=\s*\d+', 'targetSdk = 35', s)
              p.write_text(s)

          # Keep the previously verified blank-screen fix.
          activity = root / "app/src/main/java/com/hse107e/ocp/MainActivity.java"
          if not activity.exists():
              raise SystemExit("MainActivity.java not found")
          s = activity.read_text()
          s = s.replace("s.setAllowFileAccess(false);", "s.setAllowFileAccess(true);")
          s = s.replace("s.setAllowContentAccess(false);", "s.setAllowContentAccess(true);")
          old = 'else web.loadUrl("file:///android_asset/index.html");'
          new = '''else {
              try (java.io.InputStream is = getAssets().open("index.html")) {
                  byte[] bytes = new byte[is.available()];
                  int read = is.read(bytes);
                  String html = new String(bytes, 0, read, java.nio.charset.StandardCharsets.UTF_8);
                  web.loadDataWithBaseURL("file:///android_asset/", html, "text/html", "UTF-8", null);
              } catch (Exception e) {
                  android.widget.Toast.makeText(this, "HSE 107E: " + e.getMessage(), android.widget.Toast.LENGTH_LONG).show();
              }
          }'''
          if old in s:
              s = s.replace(old, new)
          activity.write_text(s)

          # Inject the phone layout.
          index = root / "app/src/main/assets/index.html"
          css = Path("mobile/mobile.css").read_text()
          html = index.read_text()
          viewport = '<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />'
          html = re.sub(r'<meta name="viewport"[^>]*>', viewport, html, count=1)
          if 'id="androidMobileUI"' not in html:
              html = html.replace("</head>", f'<style id="androidMobileUI">{css}</style>\n</head>', 1)

          # The source app contains a full-screen #splash layer. On the Android
          # build, do not allow that layer to remain permanently visible if the
          # source JavaScript fails to dismiss it.
          splash_guard = r'''
<script id="androidSplashGuard">
(function () {
  function hideSplash() {
    var s = document.getElementById('splash');
    if (s) {
      s.style.display = 'none';
      s.style.visibility = 'hidden';
      s.style.opacity = '0';
      s.style.pointerEvents = 'none';
      s.setAttribute('aria-hidden', 'true');
    }
    document.documentElement.classList.add('android-app-ready');
    if (document.body) document.body.classList.add('android-app-ready');
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function () {
      setTimeout(hideSplash, 900);
    });
  } else {
    setTimeout(hideSplash, 900);
  }
  window.addEventListener('load', function () {
    setTimeout(hideSplash, 300);
  });
})();
</script>
'''
          if 'id="androidSplashGuard"' not in html:
              html = html.replace("</body>", splash_guard + "\n</body>", 1)

          index.write_text(html)

          # Force portrait mode.
          manifest = root / "app/src/main/AndroidManifest.xml"
          if manifest.exists():
              m = manifest.read_text()
              if "android:screenOrientation=" not in m:
                  m = re.sub(
                      r'(<activity[^>]*android:name="(?:\\.MainActivity|com\\.hse107e\\.ocp\\.MainActivity)"[^>]*)>',
                      r'\1 android:screenOrientation="portrait">',
                      m, count=1
                  )
                  manifest.write_text(m)
          PY

          mkdir -p source/android/app/src/main/assets/libs
          curl -fL --retry 3 -o source/android/app/src/main/assets/libs/xlsx.full.min.js https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js

          touch source/android/gradle.properties
          grep -q '^android.useAndroidX=true$' source/android/gradle.properties || echo 'android.useAndroidX=true' >> source/android/gradle.properties
          grep -q '^android.enableJetifier=true$' source/android/gradle.properties || echo 'android.enableJetifier=true' >> source/android/gradle.properties

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build signed debug APK
        working-directory: source/android
        run: gradle assembleDebug --no-daemon

      - name: Verify APK
        run: |
          APK="source/android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          echo "APK size: $(stat -c%s "$APK") bytes"
          sha256sum "$APK"

      - uses: actions/upload-artifact@v4
        with:
          name: HSE107E-Android-Compatible
          if-no-files-found: error
          path: source/android/app/build/outputs/apk/debug/app-debug.apk