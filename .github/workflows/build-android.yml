name: Build HSE 107E APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'DOC-20261119-WA0121.zip'
      - '.github/workflows/build-android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract and patch Android project
        run: |
          unzip -q DOC-20261119-WA0121.zip -d source
          test -f source/android/settings.gradle
          test -f source/android/app/build.gradle
          test -f source/android/app/src/main/assets/index.html

          # WebView must be allowed to load file:///android_asset/index.html.
          python3 - <<'PY'
          from pathlib import Path
          p=Path("source/android/app/src/main/java/com/hse107e/ocp/MainActivity.java")
          s=p.read_text()
          s=s.replace("s.setAllowFileAccess(false);","s.setAllowFileAccess(true);")
          s=s.replace("s.setAllowContentAccess(false);","s.setAllowContentAccess(true);")
          p.write_text(s)
          PY

          # Bundle SheetJS locally so Excel functions never depend on internet access.
          mkdir -p source/android/app/src/main/assets/libs
          curl -fL --retry 3 -o source/android/app/src/main/assets/libs/xlsx.full.min.js https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js

          touch source/android/gradle.properties
          grep -q '^android.useAndroidX=true$' source/android/gradle.properties || echo 'android.useAndroidX=true' >> source/android/gradle.properties
          grep -q '^android.enableJetifier=true$' source/android/gradle.properties || echo 'android.enableJetifier=true' >> source/android/gradle.properties

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK, release APK and AAB
        working-directory: source/android
        run: gradle assembleDebug assembleRelease bundleRelease --no-daemon

      - name: Upload build outputs
        uses: actions/upload-artifact@v4
        with:
          name: HSE107E-Android-FIXED
          if-no-files-found: error
          path: |
            source/android/app/build/outputs/apk/debug/*.apk
            source/android/app/build/outputs/apk/release/*.apk
            source/android/app/build/outputs/bundle/release/*.aab
